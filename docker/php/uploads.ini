; Batas upload PRISM. Tanpa file ini PHP memakai default (upload 2 MB, POST 8 MB), sehingga
; dokumen PDF 2–5 MB ditolak PHP sebelum sampai ke aplikasi ("failed to upload").
; Aturan sebenarnya ada di aplikasi: dokumen project maks. 5 MB, dokumen ticket (kronologi, BA serah
; terima) maks. 10 MB per file dan bisa beberapa file sekaligus. Angka di sini sengaja sedikit di atas
; itu, supaya file kebesaran mendapat pesan validasi yang jelas, bukan ditolak diam-diam.
upload_max_filesize = 11M
post_max_size = 40M
