; Batas upload PRISM. Tanpa file ini PHP memakai default (upload 2 MB, POST 8 MB), sehingga
; dokumen PDF 2–5 MB ditolak PHP sebelum sampai ke aplikasi ("failed to upload").
; Aturan sebenarnya ada di aplikasi: dokumen project wajib PDF, maks. 5 MB. Angka di sini sengaja
; sedikit di atas itu, supaya file 5–6 MB mendapat pesan validasi yang jelas, bukan ditolak diam-diam.
upload_max_filesize = 6M
post_max_size = 8M
