services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: iassprism/prism-app:latest
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_PORT: 3306
    expose:
      - "8080"
    volumes:
      - storage_data:/var/www/html/storage/app
      - ./docfile:/var/www/html/docfile
    depends_on:
      db:
        condition: service_healthy
    # `/up` route bawaan Laravel (bootstrap/app.php). start_period memberi jeda
    # buat entrypoint: nunggu DB, migrate, lalu config/route cache.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-prism}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  storage_data:
  caddy_data:
  caddy_config:
